<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradiente em CSS</title>
    <style>
        /* Aplica 100% de altura apenas na estrutura do documento */
        html, body {
            height: 100%;
            margin: 0;
        }
        
        body {
            background-image: linear-gradient(to top, #F2DABD, #F7F0E4);
            background-attachment: fixed;
        }

        p {
            color: #2B2E30;
        }

        h1 {
            color: #2B2E30;
        }
    </style>
</head>
<body>
    <h1>Testando Gradiente</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Autem perferendis tempore minus! Sapiente tempore iure 
    architecto! Asperiores incidunt officia enim at quasi ratione 
    nulla, excepturi fuga animi possimus nisi tempore.</p>
</body>
</html>
