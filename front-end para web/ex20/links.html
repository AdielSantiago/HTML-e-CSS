<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>links</title>

    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        a{
            color: red;
            text-decoration: none;
            font-weight: bold;
        }

        a:visited{
            color: darkred;
        }

        a:hover{
            color: rgb(255, 3, 3);
            text-decoration: underline;
        }

        a:active{
            color: aquamarine;
        }

        a::after{
            content: " [LINK]";
            text-decoration: none;
            font-weight: normal;
            color: rgb(0, 153, 255);
        }
    </style>
</head>
<body>
    <h1>Personalizando links</h1>
    <ul>
        <li><a href="https://github.com/AdielSantiago "target="_blank">Repositório GitHub</a></li>
        <li><a href="http://youtube.com/Curso em Vídeo"target="_blank">Canal youtube</a></li>
        <li><a href="https://www.cursoemvideo.com"target="_blank">Site Curso em vídeo</a></li>  
    </ul>


    
</body>
</html>
